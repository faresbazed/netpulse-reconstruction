name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project NetPulseReconstructed.xcodeproj \
            -scheme NetPulseReconstructed \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/NetPulseReconstructed.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/Payload/NetPulseReconstructed.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Payload" \
            "$RUNNER_TEMP/NetPulseReconstructed-unsigned.ipa"
          ls -lh "$RUNNER_TEMP/NetPulseReconstructed-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetPulseReconstructed-unsigned-ipa
          path: ${{ runner.temp }}/NetPulseReconstructed-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
